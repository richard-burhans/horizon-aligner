<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 10px; }
    .box-input { fill: #56B4E9; stroke: none; rx: 4px; }
    .box-index { fill: #E69F00; stroke: none; rx: 4px; }
    .box-seed { fill: #009E73; stroke: none; rx: 4px; }
    .box-ungap { fill: #CC79A7; stroke: none; rx: 4px; }
    .box-gap { fill: #D55E00; stroke: none; rx: 4px; }
    .box-resolve { fill: #F0E442; stroke: none; rx: 4px; }
    .box-output { fill: #0072B2; stroke: none; rx: 4px; }
    .box-text { fill: white; font-weight: bold; }
    .box-text-dark { fill: #333333; font-weight: bold; }
    .arrow { stroke: #333333; stroke-width: 1.5px; fill: none; marker-end: url(#arrowhead); }
    .label { font-size: 9px; fill: #333333; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <text x="10" y="20" font-weight="bold" font-size="12px" fill="#333333">Figure 1. The Horizon Alignment Pipeline</text>

  <!-- Level 1: Inputs -->
  <rect x="200" y="40" width="200" height="30" class="box-input" />
  <text x="300" y="59" text-anchor="middle" class="box-text">FASTA Inputs (Target &amp; Query)</text>
  
  <path d="M300,70 L300,90" class="arrow" />

  <!-- Level 2: Indexing -->
  <rect x="200" y="90" width="200" height="30" class="box-index" />
  <text x="300" y="109" text-anchor="middle" class="box-text">Target Indexing (Exact Spaced-Seed)</text>

  <path d="M300,120 L300,140" class="arrow" />

  <!-- Level 3: Seeding -->
  <rect x="200" y="140" width="200" height="30" class="box-seed" />
  <text x="300" y="159" text-anchor="middle" class="box-text">Seeding (Query Intersection)</text>

  <!-- Branches -->
  <path d="M300,170 L300,210" class="arrow" />
  <text x="310" y="190" class="label">Primary 11-of-15 mask</text>

  <path d="M400,155 L480,155 L480,195" class="arrow" />
  <text x="490" y="175" class="label">Fallback (RY20 / AA)</text>
  <path d="M480,195 L480,225 L400,225" class="arrow" />

  <!-- Level 4: Ungapped Extension -->
  <rect x="200" y="210" width="200" height="30" class="box-ungap" />
  <text x="300" y="229" text-anchor="middle" class="box-text">Ungapped Extension &amp; LCB Chaining</text>

  <path d="M300,240 L300,280" class="arrow" />

  <!-- Level 5: Gapped Extension -->
  <rect x="200" y="280" width="200" height="30" class="box-gap" />
  <text x="300" y="299" text-anchor="middle" class="box-text">Banded MDL+BOCPD Gapped Alignment</text>

  <path d="M300,310 L300,350" class="arrow" />
  <text x="310" y="335" class="label">Bit-savings &gt;= min_delta</text>

  <path d="M200,295 L140,295 L140,365 L200,365" class="arrow" />
  <text x="130" y="335" class="label" text-anchor="end">Explicit Abstention</text>

  <!-- Level 6: Resolution -->
  <rect x="200" y="350" width="200" height="30" class="box-resolve" />
  <text x="300" y="369" text-anchor="middle" class="box-text-dark">Paralog Resolution (E-Graph)</text>

  <path d="M300,380 L300,420" class="arrow" />
  
  <!-- Level 7: Output -->
  <rect x="200" y="420" width="200" height="30" class="box-output" />
  <text x="300" y="439" text-anchor="middle" class="box-text">MAF / GFA Output</text>
</svg>
