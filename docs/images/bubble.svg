<svg width="600" height="150" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; }
    .block { fill: #E69F00; stroke: #333333; stroke-width: 1px; rx: 2px; }
    .path { stroke: #333333; stroke-width: 2px; fill: none; }
    .unaligned { stroke: #56B4E9; stroke-width: 2px; stroke-dasharray: 4 2; fill: none; }
  </style>

  <text x="10" y="20" font-weight="bold" font-size="12px">Figure 2. Horizon Bubble Graph Topology</text>

  <!-- LCBs -->
  <rect x="50" y="60" width="60" height="20" class="block" />
  <text x="80" y="74" text-anchor="middle">LCB 1</text>

  <rect x="250" y="60" width="60" height="20" class="block" />
  <text x="280" y="74" text-anchor="middle">LCB 2</text>

  <rect x="450" y="60" width="60" height="20" class="block" />
  <text x="480" y="74" text-anchor="middle">LCB 3</text>

  <!-- Paths -->
  <!-- Aligned DP Path -->
  <path d="M110,70 L250,70" class="path" />
  <text x="180" y="65" text-anchor="middle">Aligned DP Path</text>

  <!-- Unaligned Horizon Bubble -->
  <path d="M310,65 Q380,40 450,65" class="unaligned" />
  <text x="380" y="45" text-anchor="middle" fill="#0072B2">Unaligned Target</text>

  <path d="M310,75 Q380,100 450,75" class="unaligned" />
  <text x="380" y="105" text-anchor="middle" fill="#0072B2">Unaligned Query</text>

  <text x="380" y="130" text-anchor="middle" font-size="9px" font-style="italic">
    Explicit abstention preserves graph topology as a Horizon Bubble
  </text>
</svg>
