[package]
name = "horizon-aligner"
version = "0.1.0"
edition = "2024"
authors = ["Richard Burhans <rcb112@psu.edu>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/richard-burhans/horizon"
keywords = ["bioinformatics", "genomics", "pangenome", "alignment", "gfa"]
categories = ["science::bioinformatics::genomics", "command-line-utilities"]
description = "Pure-Rust information-theoretic genome alignment and pangenome graph suite (MDL + BOCPD + e-graphs + HAL/GFA/rGFA)."

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
rayon = "1.10"
thiserror = "2.0"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
