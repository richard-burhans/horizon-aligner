[package]
name = "horizon-aligner"
version = "0.1.0"
edition = "2024"
description = "MDL + BOCPD + KP-14 banded whole-genome aligner with Horizon Bubbles."

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
rayon = "1.10"
thiserror = "2.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
